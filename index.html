<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator</title>
    

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet">
 </head>
<body>

<div class="container">

    <!-- Input Section -->
    <div class="top-box">

        <!-- Budget -->
        <div class="box">
            <h2>Budget</h2>

            <input type="number" id="budget" placeholder="Enter Total Amount">

            <button id="budgetBtn">Set Budget</button>
        </div>

        <!-- Expense -->
        <div class="box">
            <h2>Expenses</h2>

            <input type="text" id="title" placeholder="Enter Title of Product">

            <input type="number" id="amount" placeholder="Enter Cost of Product">

            <button id="expenseBtn">Check Amount</button>
        </div>

    </div>

    <!-- Summary -->
    <div class="summary">

        <div class="card">
            <h3>Total Budget</h3>
            <h2 id="totalBudget">0</h2>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <h2 id="totalExpense">0</h2>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <h2 id="balance">0</h2>
        </div>

    </div>

    <!-- Expense List -->
    <div class="expense-list">

        <h2>Expense List</h2>

        <table>

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="expenseTable">

                <!-- JavaScript se data add hoga -->

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
