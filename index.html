<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Budget Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


</head>
<body>

<div class="container">

    <h1> Budget Calculator</h1>

    <!-- Budget -->

    <div class="box">

        <h2>Set Budget</h2>

        <input type="number"
        id="budgetInput"
        placeholder="Enter Budget">

        <button id="budgetBtn">
            Set Budget
        </button>

    </div>

    <!-- Expense -->

    <div class="box">

        <h2>Add Expense</h2>

        <input
        type="text"
        id="expenseTitle"
        placeholder="Expense Name">

        <input
        type="number"
        id="expenseAmount"
        placeholder="Expense Amount">

        <select id="category">

            <option>Food</option>
            <option>Shopping</option>
            <option>Travel</option>
            <option>Education</option>
            <option>Bills</option>
            <option>Other</option>

        </select>

        <button id="expenseBtn">
            Add Expense
        </button>

    </div>

    <!-- Search -->

    <input
    type="text"
    id="search"
    placeholder="🔍 Search Expense">

    <!-- Progress -->

    <div class="progress">

        <div id="progressBar"></div>

    </div>

    <!-- Cards -->

    <div class="cards">

        <div class="card">

            <h3>Budget</h3>

            <p id="budget">0</p>

        </div>

        <div class="card">

            <h3>Expense</h3>

            <p id="expense">0</p>

        </div>

        <div class="card">

            <h3>Balance</h3>

            <p id="balance">0</p>

        </div>

    </div>

    <!-- Warning -->

    <h3 id="warning"></h3>

    <!-- Expense Table -->

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Category</th>

                <th>Amount</th>

                <th>Date</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="expenseTable">

        </tbody>

    </table>

    <button id="resetBtn">
        Reset All
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
